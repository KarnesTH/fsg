[project]
name = "fsg"
version = "0.1.0"
description = "Generates clean directory trees that respect .gitignore and keep your docs up to date."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fsg = "fsg.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fsg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.fsg]
path = "src"
depth = 2
dirs-only = false
exclude = ["*.log", "docs/api"]
fence = true
ascii = false
